}

function drawWorldBackdrop() {
  if (LV.backdrop) LV.backdrop();
  if (caveArt) ctx.drawImage(caveArt, 0, 0);
  const wx = (WARM.c0 + WARM.c1 + 1) / 2 * TS, wy = (WARM.r1 + 1) * TS;
  const pulse = 1 + Math.sin(frame * 0.05) * 0.06;
  const wg = ctx.createRadialGradient(wx, wy, 10, wx, wy, 150 * pulse);
  wg.addColorStop(0, 'rgba(255,170,70,0.7)'); wg.addColorStop(0.5, 'rgba(255,110,40,0.22)'); wg.addColorStop(1, 'rgba(255,90,30,0)');
  ctx.fillStyle = wg; ctx.fillRect(wx - 160, wy - 160, 320, 170);
}

// screen-space: drifting pollen / fireflies / snow, and a soft vignette
function drawAtmosphere() {
  // snow doesn't fall in caves
  const indoors = LV.caves && P && state !== 'title' && inRects(LV.caves, Math.floor((P.x + P.w / 2) / TS), Math.floor((P.y + P.h / 2) / TS));
  snowA = lerp(snowA, indoors ? 0.12 : 0.75, 0.05);
  for (const m of motes) {
    let x, y;
    if (TH.motes === 'snow') {
      m.y += m.v * 3 + 0.6; m.x += 1.2 + Math.sin(frame * 0.02 + m.p) * 0.6;
      x = ((m.x - camX * 0.6) % VW + VW) % VW; y = ((m.y - camY * 0.6) % VH + VH) % VH;
      ctx.fillStyle = `rgba(255,255,255,${snowA})`; ctx.beginPath(); ctx.arc(x, y, m.s * 1.2, 0, 7); ctx.fill();
      continue;
    }
    m.y -= m.v * 0.3; m.x += Math.sin(frame * 0.01 + m.p) * 0.25;
    x = ((m.x - camX * 0.5) % VW + VW) % VW; y = ((m.y - camY * 0.5) % VH + VH) % VH;
    if (TH.motes === 'firefly') {
      const a = Math.max(0, Math.sin(frame * 0.04 + m.p * 3));
      ctx.fillStyle = `rgba(255,236,140,${a * 0.25})`; ctx.beginPath(); ctx.arc(x, y, m.s * 4, 0, 7); ctx.fill();
      ctx.fillStyle = `rgba(255,250,200,${a * 0.9})`; ctx.beginPath(); ctx.arc(x, y, m.s * 0.9, 0, 7); ctx.fill();
      continue;
    }
    ctx.fillStyle = `rgba(255,248,215,${0.35 + Math.sin(frame * 0.03 + m.p) * 0.2})`;
    ctx.beginPath(); ctx.arc(x, y, m.s, 0, 7); ctx.fill();
  }
  const v = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.45, VW / 2, VH / 2, VW * 0.72);
  v.addColorStop(0, `rgba(${TH.tint},0)`); v.addColorStop(1, `rgba(${TH.tint},${TH.storm ? 0.4 : 0.28})`);
  ctx.fillStyle = v; ctx.fillRect(0, 0, VW, VH);
}

function spawnWarmEmbers() {
  if (!WARM) return;
  if (frame % 6 === 0) particles.push({ x: rand(WARM.c0 * TS, (WARM.c1 + 1) * TS), y: (WARM.r1 + 1) * TS - 2, vx: rand(-0.2, 0.2), vy: rand(-1.2, -0.5), life: 60, max: 60, color: 'rgba(255,190,110,0.7)', size: rand(1.5, 3.5), grav: 0, shape: 'c' });
  if (TH.warm === 'steam' && frame % 5 === 0) particles.push({ x: rand(WARM.c0 * TS, (WARM.c1 + 1) * TS), y: (WARM.r1 + 1) * TS - 4, vx: rand(-0.3, 0.3), vy: rand(-1.1, -0.5), life: 70, max: 70, color: 'rgba(255,255,255,0.28)', size: rand(6, 11), grav: 0, shape: 'c' });
}

function drawSigns() {
  ctx.font = `600 12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const s of signs) {
    const x = s.c * TS + 16, y = s.r * TS;
    if (x < camX - 200 || x > camX + VW + 200) continue;
    const w = Math.max(...s.t.map(l => ctx.measureText(l).width)) + 20, h = s.t.length * 15 + 10;
    ctx.strokeStyle = TH.outline; ctx.lineWidth = 2.5;
    ctx.fillStyle = ART.bark; ctx.beginPath(); ctx.roundRect(x - 3.5, y - 26, 7, 26, 2); ctx.fill(); ctx.stroke();
    const bgr = ctx.createLinearGradient(0, y - 26 - h, 0, y - 26);
    bgr.addColorStop(0, '#f4dcaa'); bgr.addColorStop(1, '#dcb479');
    ctx.fillStyle = bgr; ctx.beginPath(); ctx.roundRect(x - w / 2, y - 26 - h, w, h, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(120,80,40,0.25)'; ctx.fillRect(x - w / 2 + 6, y - 26 - 5, w - 12, 2);
    ctx.fillStyle = ART.barkDark;
    for (const nx of [x - w / 2 + 6, x + w / 2 - 6]) { ctx.beginPath(); ctx.arc(nx, y - 26 - h + 6, 1.8, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#4a3020';
    s.t.forEach((l, i) => ctx.fillText(l, x, y - 26 - h + 13 + i * 15));
  }
}

function drawSeeds() {
  for (const s of seeds) {
    if (s.got) continue;
    const y = s.y + Math.sin(frame * 0.08 + s.ph) * 3;
    ctx.save(); ctx.translate(s.x, y); ctx.rotate(Math.sin(frame * 0.05 + s.ph) * 0.4);
    ctx.fillStyle = 'rgba(255,230,120,0.35)'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffcf3f'; ctx.strokeStyle = '#8a5a1a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 8, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(138,90,26,0.6)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(0, 6); ctx.stroke();
    ctx.restore();
  }
}

function drawNest() {
  const x = NEST.c0 * TS, y = NEST.r * TS, w = (NEST.c1 - NEST.c0 + 1) * TS;
  const mx = x + w * 0.3, my = y - 22 + Math.sin(frame * 0.05) * 2;
  ctx.save(); ctx.translate(mx, my); ctx.scale(1.6, 1.6);
  drawBirdBody({ flapAnim: state === 'win' || state === 'clear' ? (frame % 20) : 0, gliding: false, onGround: true, vx: 0, anim: 0 }, false);
  ctx.restore();
  ctx.fillStyle = '#8a5a2b';
  ctx.beginPath(); ctx.ellipse(x + w / 2, y - 10, w / 2 + 4, 16, 0, 0, Math.PI); ctx.fill();
  ctx.strokeStyle = '#5e3c1c'; ctx.lineWidth = 2.5;
  for (let i = 0; i < 8; i++) {
    ctx.beginPath(); const a = x + 4 + i * (w / 8);
    ctx.moveTo(a, y - 12 + (i % 2) * 5); ctx.quadraticCurveTo(a + 14, y + 2, a + 24, y - 8 - (i % 3) * 3); ctx.stroke();
  }
  ctx.fillStyle = '#a8743f'; ctx.beginPath(); ctx.ellipse(x + w / 2, y - 10, w / 2 + 4, 5, 0, 0, 7); ctx.fill();
  if (state === 'intro' && LV.intro === 'nest' && introT > 90) { txt('!', mx + 10, y - 90, 34, '#ffe066', 'center'); return; }
  if (state === 'intro') return;
  const hy = y - 80 + Math.sin(frame * 0.07) * 5;
  ctx.fillStyle = '#ff6b8a'; ctx.beginPath();
  ctx.moveTo(mx, hy + 6); ctx.bezierCurveTo(mx - 14, hy - 4, mx - 6, hy - 14, mx, hy - 6); ctx.bezierCurveTo(mx + 6, hy - 14, mx + 14, hy - 4, mx, hy + 6); ctx.fill();
}

// ---------- character art ----------
const CRACKS = [
  [[-2, -15], [0, -10], [-3, -7], [1, -3]],
  [[12, -4], [7, -2], [9, 2], [4, 4]],
  [[-12, 3], [-7, 1], [-5, 6], [-1, 4], [1, 9]],
  [[-6, -12], [-9, -6], [-12, -5]],
  [[6, -12], [3, -8], [8, -6], [5, -1]],
];
function eggPath(w, h) {
  ctx.beginPath();
  ctx.moveTo(0, -h);
  ctx.bezierCurveTo(w * 0.75, -h, w, -h * 0.2, w, h * 0.25);
  ctx.bezierCurveTo(w, h * 0.8, w * 0.55, h, 0, h);
  ctx.bezierCurveTo(-w * 0.55, h, -w, h * 0.8, -w, h * 0.25);
  ctx.bezierCurveTo(-w, -h * 0.2, -w * 0.75, -h, 0, -h);
  ctx.closePath();
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mixHex(a, b, t) { const A = hexRgb(a), B = hexRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
function drawEggBody(w, h, cracks, face, blink, heat = 0) {
  eggPath(w, h);
  const g = ctx.createRadialGradient(-w * 0.35, -h * 0.4, 1, 0, 0, h * 1.2);
  g.addColorStop(0, '#fffdf6'); g.addColorStop(1, heat > 0 ? mixHex('#ead3ac', '#ff9a5a', heat) : '#ead3ac');
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#5b3d24'; ctx.stroke();
  ctx.fillStyle = 'rgba(196,150,95,0.45)';
  for (const [a, b, r] of [[-6, 7, 2.2], [5, 10, 1.6], [8, -5, 1.8], [-8, -5, 1.4]]) { ctx.beginPath(); ctx.arc(a * w / 13, b * h / 15.5, r, 0, 7); ctx.fill(); }
  const ex = face * 3 * w / 13;
  ctx.fillStyle = '#2a1a10';
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(ex + s * 4.3, -2, 2.1, blink ? 0.6 : 3, 0, 0, 7); ctx.fill(); }
  if (!blink) { ctx.fillStyle = '#fff'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(ex + s * 4.3 - 0.7, -3.2, 0.9, 0, 7); ctx.fill(); } }
  ctx.fillStyle = `rgba(255,120,120,${0.4 + heat * 0.4})`;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(ex + s * 7.5, 3, 2.4, 1.4, 0, 0, 7); ctx.fill(); }
  ctx.strokeStyle = '#5b3d24'; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
  for (let i = 0; i < Math.min(cracks, CRACKS.length); i++) {
    ctx.beginPath();
    CRACKS[i].forEach(([a, b], j) => j ? ctx.lineTo(a * w / 13, b * h / 15.5) : ctx.moveTo(a * w / 13, b * h / 15.5));
    ctx.stroke();
  }
}

function drawBirdBody(o, withCap = true) {
  // origin at feet, facing right
  const running = o.onGround && Math.abs(o.vx) > 0.3;
  ctx.strokeStyle = '#f39a2b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (const s of [-1, 1]) {
    let fx = s * 4, fy = 0;
    if (running) { fx += Math.sin(o.anim + (s > 0 ? Math.PI : 0)) * 5; fy = -Math.max(0, Math.cos(o.anim + (s > 0 ? Math.PI : 0))) * 3; }
    else if (!o.onGround) { fx = s * 3 - 2; fy = -3; }
    ctx.beginPath(); ctx.moveTo(s * 3, -7); ctx.lineTo(fx, fy); ctx.lineTo(fx + 4, fy); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#f5b82e'; ctx.strokeStyle = '#5b3d24'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-10, -18); ctx.lineTo(-20, -24); ctx.lineTo(-18, -17); ctx.lineTo(-22, -13); ctx.lineTo(-10, -12); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffd23f'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, -18, 13, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff0a8'; ctx.beginPath(); ctx.ellipse(3, -13, 8, 6, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#5b3d24'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-1, -31); ctx.quadraticCurveTo(-4, -37, 2, -38); ctx.stroke();
  ctx.fillStyle = '#2a1a10'; ctx.beginPath(); ctx.ellipse(6, -21, 2.2, 3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(5.3, -22.2, 0.9, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,120,120,0.45)'; ctx.beginPath(); ctx.ellipse(8, -15, 2.4, 1.4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#f39a2b'; ctx.strokeStyle = '#5b3d24'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(11, -21); ctx.lineTo(19, -17.5); ctx.lineTo(11, -14); ctx.closePath(); ctx.fill(); ctx.stroke();
  let wa = 0.35;
  if (o.flapAnim > 0) wa = -1.3 * Math.sin((14 - o.flapAnim) / 14 * Math.PI) + 0.2;
  else if (o.gliding) wa = -0.7 + Math.sin(frame * 0.3) * 0.08;
  else if (running) wa = 0.35 + Math.sin(o.anim * 2) * 0.15;
  ctx.save(); ctx.translate(-3, -18); ctx.rotate(wa);
  ctx.fillStyle = '#f5b82e'; ctx.strokeStyle = '#5b3d24'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(-6, 0, 10, 5.5, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.restore();
  if (withCap) {
    ctx.save(); ctx.translate(-1, -30); ctx.rotate(-0.25);
    ctx.fillStyle = '#fffaf0'; ctx.strokeStyle = '#5b3d24'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-10, 2);
    ctx.bezierCurveTo(-10, -8, -5, -12, 0, -12); ctx.bezierCurveTo(5, -12, 10, -8, 10, 2);
    ctx.lineTo(7, -1); ctx.lineTo(4, 3); ctx.lineTo(1, -1); ctx.lineTo(-2, 3); ctx.lineTo(-5, -1); ctx.lineTo(-8, 3); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

// the jagged holes the legs broke through at the bottom of the shell (egg-local coords, h = half height)
function drawLegHoles(h, k) {
  for (const s of [-1, 1]) {
    const x = s * 4.5, y = h - 3;
    ctx.fillStyle = '#5b3d24';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2, r = (i % 2 ? 2.2 : 3.6) * k;
      ctx.lineTo(x + Math.cos(a) * r * 1.2, y + Math.sin(a) * r * 0.8);
    }
    ctx.closePath(); ctx.fill();
  }
}
// hairline cracks spreading up from the bottom while the legs push against the shell
function drawStrainCracks(h, k) {
  ctx.strokeStyle = '#5b3d24'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
  for (const s of [-1, 1]) {
    const len = 3 + k * 9;
    ctx.beginPath(); ctx.moveTo(s * 4.5, h - 1);
    ctx.lineTo(s * 2.5, h - len * 0.4); ctx.lineTo(s * 6, h - len * 0.7); ctx.lineTo(s * 4, h - len);
    ctx.stroke();
  }
}

function drawCharacter(o, alpha = 1) {
  const F = FORMS[o.form === 'legs' && o.tucked ? 'egg' : o.form];
  ctx.save();
  ctx.globalAlpha = alpha;
  let ox = 0, oy = 0;
  if (o === P && P.trans && P.transTo === 'bird' && P.form !== 'bird') ox = rand(-1, 1) * (1 - P.trans / P.transMax) * 5;
  if (o === P && P.floating) oy = Math.sin(frame * 0.12) * 1.5;
  ctx.translate(o.x + F.w / 2 + ox, o.y + F.h + oy);
  ctx.scale(o.sx, o.sy);
  const blink = o === P && P.blink > 0;
  if (o.form === 'egg' || o.tucked) {
    ctx.translate(0, -13); ctx.rotate(o.angle);
    if (o.tucked) { // little tucked-in feet peeking out, rolling with the shell
      ctx.fillStyle = '#f39a2b'; ctx.strokeStyle = '#5b3d24'; ctx.lineWidth = 1.5;
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * 5, 11.5, 3.5, 2.5, 0, 0, 7); ctx.fill(); ctx.stroke(); }
    }
    drawEggBody(11.5, 13, o.cracks, o.face, blink, o === P && o.form === 'egg' ? Math.min(1, P.heat / 110) : 0);
  } else if (o.form === 'legs' && o.dashT > 0) {
    // dashing: the egg tips over and rams head first, legs streaming out behind
    const k = o === P ? Math.min(1, (FORMS.legs.dashT + 1 - o.dashT) / 3) : 1;
    ctx.translate(0, -20); ctx.rotate(o.face * Math.PI / 2 * k);
    ctx.strokeStyle = '#f39a2b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      const fl = Math.sin(frame * 0.9 + s) * 1.5;
      ctx.beginPath(); ctx.moveTo(s * 4, 12); ctx.lineTo(s * 4 + fl, 24); ctx.lineTo(s * 4 + fl + o.face * 4, 25); ctx.stroke();
    }
    ctx.lineCap = 'butt';
    drawEggBody(12.5, 14.5, o.cracks, o.face, blink);
    drawLegHoles(14.5, 1);
  } else if (o.form === 'legs') {
    const lg = o.legGrow, legH = 11 * lg;
    const running = o.onGround && Math.abs(o.vx) > 0.3;
    // legs transformation: the shell wobbles harder and harder before they pop out
    const pre = o === P && P.trans && P.transTo === 'legs' ? clamp((1 - P.trans / P.transMax) / LEG_POP, 0, 1) : 0;
    const wob = pre > 0 && pre < 1 ? Math.sin(frame * (0.6 + pre * 0.9)) * 0.22 * pre : 0;
    ctx.strokeStyle = '#f39a2b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      let fx = s * 4, fy = 0;
      if (running) { const ph = o.anim + (s > 0 ? Math.PI : 0); fx += Math.sin(ph) * 6 * o.face; fy = -Math.max(0, Math.cos(ph)) * 4; }
      else if (!o.onGround) { fx = s * 5; fy = -3; }
      if (o.dashT > 0) { fx = s * 3 - o.face * 7; fy = -2; }
      ctx.beginPath(); ctx.moveTo(s * 4 * lg, -legH); ctx.lineTo(fx * lg, fy * lg); ctx.lineTo((fx + o.face * 5) * lg, fy * lg); ctx.stroke();
    }
    ctx.lineCap = 'butt';
    const lean = o.dashT > 0 ? 0.35 * o.face : clamp(o.vx * 0.04, -0.18, 0.18);
    const bob = running ? -Math.abs(Math.sin(o.anim)) * 1.5 : 0;
    ctx.translate(0, -legH - 14.5 + bob); ctx.rotate(o.angle + lean + wob);
    let cr = o.cracks;
    if (o === P && P.trans && P.transTo === 'bird') cr = 3 + Math.floor((1 - P.trans / P.transMax) * 3);
    drawEggBody(12.5, 14.5, cr, o.face, blink);
    if (pre > 0 && pre < 1) drawStrainCracks(14.5, pre);
    if (lg > 0) drawLegHoles(14.5, Math.min(1, lg));
  } else {
    ctx.scale(o.face, 1);
    drawBirdBody(o);
  }
  ctx.restore();
}

function drawPlayer() {
  if (P.dead) return;
  if (P.onGround) { ctx.fillStyle = 'rgba(35,20,10,0.22)'; ctx.beginPath(); ctx.ellipse(P.x + P.w / 2, P.y + P.h, P.w * 0.62, 4, 0, 0, 7); ctx.fill(); }
  P.trail.forEach((t, i) => drawCharacter(t, (i + 1) / P.trail.length * 0.3));
  drawCharacter(P);
  if (P.y + P.h < camY) {   // flying up out of view: a little marker at the top edge shows where you are
    const x = P.x + P.w / 2, y = camY + 10, a = 0.6 + Math.sin(frame * 0.2) * 0.3;
    ctx.fillStyle = `rgba(255,210,63,${a})`; ctx.strokeStyle = 'rgba(91,61,36,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 9, y + 8); ctx.lineTo(x - 9, y + 8); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  if (P.form === 'egg' && P.heat > 0) {
    const x = P.x + P.w / 2, y = P.y - 14, k = Math.min(1, P.heat / 110);
    ctx.fillStyle = 'rgba(30,20,40,0.6)'; ctx.beginPath(); ctx.roundRect(x - 22, y - 4, 44, 8, 4); ctx.fill();
    ctx.fillStyle = mixHex('#ffd23f', '#ff5a2a', k); ctx.beginPath(); ctx.roundRect(x - 21, y - 3, 42 * k, 6, 3); ctx.fill();
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a; ctx.fillStyle = p.color;
    if (p.shape === 'c') { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, 7); ctx.fill(); }
    else if (p.shape === 's') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath(); ctx.moveTo(-p.size / 2, -p.size / 3); ctx.lineTo(p.size / 2, -p.size / 2); ctx.lineTo(p.size / 3, p.size / 2); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else {
      const s = p.size; ctx.beginPath();
      ctx.moveTo(p.x, p.y - s * 2); ctx.lineTo(p.x + s * 0.5, p.y - s * 0.5); ctx.lineTo(p.x + s * 2, p.y); ctx.lineTo(p.x + s * 0.5, p.y + s * 0.5);
      ctx.lineTo(p.x, p.y + s * 2); ctx.lineTo(p.x - s * 0.5, p.y + s * 0.5); ctx.lineTo(p.x - s * 2, p.y); ctx.lineTo(p.x - s * 0.5, p.y - s * 0.5); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function fmtTime(f) { const s = f / 60; return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}.${String(Math.floor((s % 1) * 10))}`; }

function drawTitle() {

  txt('One life per try · missed seeds add +10 s to your time · dashing smashes rocks but EVERY impact cracks you', cx, 440, 13, 'rgba(255,255,255,0.88)', 'center', 500);
  if (touchMode) txt('Stick: move · pull ↓ to tuck   ·   JUMP / DASH buttons   ·   ⟲ hold to restart the level', cx, 466, 13, 'rgba(255,255,255,0.85)', 'center', 500);
  else txt('← →  move   ·   SPACE / Z  jump   ·   SHIFT / X  dash   ·   hold ↓  tuck legs   ·   hold R  restart level   ·   P  pause   ·   M  mute', cx, 466, 13, 'rgba(255,255,255,0.85)', 'center', 500);
}
function levelCard(i) { const n = LEVELS.length, w = Math.min(250, (VW - 60) / n - 18), gap = 18, x0 = VW / 2 - (w * n + gap * (n - 1)) / 2; return { x: x0 + i * (w + gap), y: 300, w, h: 78 }; }
function levelCardAt(x, y) { for (let i = 0; i < LEVELS.length; i++) { const c = levelCard(i); if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) return i; } return -1; }

const DEATHS = {

// ============================ TOUCH CONTROLS ============================
// Shown automatically on phones/tablets; the corner button toggles them on any device (remembered).
let touchMode = false;
function setTouchMode(on) {
  touchMode = on;
  document.body.classList.toggle('touch', on);
  document.getElementById('touchToggle').textContent = on ? 'Hide touch controls' : 'Touch controls';
  try { localStorage.setItem('eggventure-touch', on ? '1' : '0'); } catch (e) {}
}
(() => {
  let saved = null;
  try { saved = localStorage.getItem('eggventure-touch'); } catch (e) {}
  setTouchMode(saved !== null ? saved === '1' : matchMedia('(hover: none) and (pointer: coarse)').matches);
})();
document.getElementById('touchToggle').addEventListener('click', e => { setTouchMode(!touchMode); e.currentTarget.blur(); });

function setKey(k, on) { if (on && !keys[k]) pressedK[k] = true; keys[k] = on; if (on) initAudio(); }

// Thumb stick: slide left/right to move, pull down to tuck (leggy egg)
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let stickId = null;
function stickMove(e) {
  const r = stick.getBoundingClientRect(), R = r.width / 2;
  let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R);
  setKey('left', dx < -R * 0.22); setKey('right', dx > R * 0.22);
  setKey('down', dy > R * 0.45); setKey('up', dy < -R * 0.45);
  const d = Math.hypot(dx, dy), m = R * 0.6;
  if (d > m) { dx *= m / d; dy *= m / d; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
}
function stickEnd() { stickId = null; ['left', 'right', 'down', 'up'].forEach(k => setKey(k, false)); knob.style.transform = ''; stick.classList.remove('on'); }
stick.addEventListener('pointerdown', e => { stickId = e.pointerId; try { stick.setPointerCapture(e.pointerId); } catch (_) {} stick.classList.add('on'); stickMove(e); e.preventDefault(); });
stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => stick.addEventListener(ev, e => { if (e.pointerId === stickId) stickEnd(); }));

// Buttons (multi-touch friendly: each button tracks its own finger)
document.querySelectorAll('[data-key]').forEach(el => {
  const k = el.dataset.key;
  el.addEventListener('pointerdown', e => { try { el.setPointerCapture(e.pointerId); } catch (_) {} el.classList.add('on'); setKey(k, true); if (k === 'jump' && state !== 'play') setKey('start', true); e.preventDefault(); });
  const up = () => { el.classList.remove('on'); setKey(k, false); if (k === 'jump') setKey('start', false); };
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => el.addEventListener(ev, up));
});
// Tap the screen to start / continue
cvs.addEventListener('pointerdown', e => {
  if (state === 'title') {
    const r = cvs.getBoundingClientRect(), x = (e.clientX - r.left) * VW / r.width, y = (e.clientY - r.top) * VH / r.height;
    const i = levelCardAt(x, y);
    if (i >= 0) { if (i < progress.unlocked) { initAudio(); startGame(i); } e.preventDefault(); return; }
  }
  if (touchMode && state !== 'play' && state !== 'intro') { setKey('start', true); setTimeout(() => setKey('start', false), 60); e.preventDefault(); }
});
document.addEventListener('contextmenu', e => { if (touchMode) e.preventDefault(); });
document.addEventListener('gesturestart', e => e.preventDefault());

// Reflect the current form on the buttons
const dashBtn = document.getElementById('dash'), jumpBtn = document.getElementById('jump'), restartBtn = document.getElementById('restart');
function updateButtons() {
  if (!touchMode) return;
  const canDash = state === 'play' && P.form === 'legs' && !P.tucked;
  dashBtn.classList.toggle('off', !canDash);
  const label = state !== 'play' && state !== 'intro' ? 'START' : P.form === 'bird' && !P.onGround ? 'FLAP' : 'JUMP';
  if (jumpBtn.textContent !== label) jumpBtn.textContent = label;
  restartBtn.classList.toggle('hold', resetHold > 0);
}

// ============================ LOOP ============================
levelNo = 0; buildLevel(); P = newPlayer();
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) {
    update();
    if (state === 'play' && !paused) spawnWarmEmbers();
    for (const k in pressedK) delete pressedK[k];
    acc -= STEP;
  }
  draw();
  updateButtons();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Installable as an app (PWA): cache the game so it also opens offline. Only works when served over http(s).
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
