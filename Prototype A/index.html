<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eggventure</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1830">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eggventure">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:dark}
  *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
  html,body{margin:0;height:100%;width:100%;background:#1b1830;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;font-family:"Fredoka",system-ui,sans-serif}
  canvas{width:min(100vw,calc(100vh*960/544));aspect-ratio:960/544;border-radius:10px;box-shadow:0 10px 40px #0008;display:block}

  /* ---- touch controls (shown in touch mode) ---- */
  body.touch{position:fixed;inset:0;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body.touch canvas{width:min(100vw,calc(100dvh*960/544));border-radius:0;box-shadow:none;touch-action:none}
  .ctl{position:fixed;z-index:5;touch-action:none;display:none;align-items:center;justify-content:center;color:#fff;font-weight:700;letter-spacing:.5px;
       background:rgba(30,20,40,.38);border:2px solid rgba(255,255,255,.35);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);-webkit-user-select:none;user-select:none}
  body.touch .ctl{display:flex}
  .ctl.on{background:rgba(255,224,102,.45);border-color:#ffe066}
  #stick{left:calc(env(safe-area-inset-left) + 18px);bottom:calc(env(safe-area-inset-bottom) + 16px);width:150px;height:150px;border-radius:50%}
  #knob{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #fff;pointer-events:none;transition:transform .05s}
  .arrow{position:absolute;color:rgba(255,255,255,.7);font-size:18px;pointer-events:none}
  #jump{right:calc(env(safe-area-inset-right) + 20px);bottom:calc(env(safe-area-inset-bottom) + 22px);width:96px;height:96px;border-radius:50%;font-size:17px}
  #dash{right:calc(env(safe-area-inset-right) + 128px);bottom:calc(env(safe-area-inset-bottom) + 70px);width:74px;height:74px;border-radius:50%;font-size:14px}
  #dash.off{opacity:.3}
  .small{top:calc(env(safe-area-inset-top) + 8px);width:44px;height:44px;border-radius:12px;font-size:18px}
  #pause{left:calc(50% - 76px)} #restart{left:calc(50% - 22px)} #mute{left:calc(50% + 32px)}
  #restart.hold{background:rgba(255,120,90,.55)}
  #touchToggle{position:fixed;z-index:6;bottom:calc(env(safe-area-inset-bottom) + 8px);right:calc(env(safe-area-inset-right) + 8px);height:32px;padding:0 10px;border-radius:10px;
       border:1.5px solid rgba(255,255,255,.3);background:rgba(30,20,40,.45);color:rgba(255,255,255,.8);font:600 12px "Fredoka",system-ui,sans-serif;cursor:pointer;opacity:.55}
  #touchToggle:hover{opacity:1}
  body.touch #touchToggle{top:calc(env(safe-area-inset-top) + 8px);bottom:auto;height:44px;border-radius:12px}
  #rotate{position:fixed;inset:0;z-index:10;background:#1b1830;color:#ffe9a8;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;font-size:20px;padding:24px}
  #rotate .phone{width:46px;height:78px;border:4px solid #ffe9a8;border-radius:10px;animation:rot 2s ease-in-out infinite}
  @keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  @media (orientation:portrait){body.touch #rotate{display:flex}}
</style>
</head>
<body>
<canvas id="game" width="960" height="544"></canvas>
<div id="stick" class="ctl"><span class="arrow" style="left:12px">◀</span><span class="arrow" style="right:12px">▶</span><span class="arrow" style="bottom:8px">▼</span><div id="knob"></div></div>
<div id="dash" class="ctl" data-key="dash">DASH</div>
<div id="jump" class="ctl" data-key="jump">JUMP</div>
<div id="pause" class="ctl small" data-key="pause">❚❚</div>
<div id="restart" class="ctl small" data-key="reset">⟲</div>
<div id="mute" class="ctl small" data-key="mute">♪</div>
<button id="touchToggle" type="button">Touch controls</button>
<div id="rotate"><div class="phone"></div><div>Turn your phone sideways to play</div></div>
<script>
'use strict';
const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
const VW = 960, VH = 544, TS = 32;
let COLS = 72, ROWS = 36;
const FONT = '"Fredoka", system-ui, sans-serif';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const hash = (x, y) => (((x * 73856093) ^ (y * 19349663)) >>> 0);

// ============================ LEVELS ============================
// Four levels, one life. In every level you start as an egg, find a warm spot to grow legs,
// smash your way through with dashes (every impact cracks you, the 3rd crack hatches you),
// then fly to the nest as a bird. Your form decides where you can go:
//   EGG  – tiny (fits 1-tile tunnels), low hop, rolls fast downhill, FLOATS.
//   LEGS – tall, high jump, DASH. Hold ↓ to tuck in and move like an egg again (and float).
//   BIRD – flaps & glides, rides rising warm air — but can't dash, tuck or swim.
// Tiles: 0 air, 1 ground, 2 breakable rock, 3 thorns, 4 water, 5 one-way branch, 6 ramp '/', 7 downhill '\',
//        8 mushroom, 9 leaves, 10 crumbling stone, 11 rising warm air
let map, seeds, signs, enemies, crumbling;
let NEST, START, WARM, CAVE_TOP, REQUIRED;   // set by each level
let LV = null, TH = null, levelNo = 0;

// ---------- Level 1: the big tree (hand-built) ----------
// The nest sits on top of a big tree, above a leafy canopy. The egg falls through the leaves
// onto the hilltop below. The only way back up is inside the hollow trunk — with wings.
const PLUG = { c: 5, r: 32 };
function buildForest() {
  COLS = 72; ROWS = 36;
  NEST = { c0: 5, c1: 9, r: 4 };
  START = { c: 10, r: 17 };
  WARM = { c0: 18, c1: 21, r0: 32, r1: 34 };
  CAVE_TOP = 30;
  map = Array.from({ length: ROWS }, () => new Array(COLS).fill(1));
  const set = (c0, r0, c1, r1, t) => { for (let y = r0; y <= r1; y++) for (let x = c0; x <= c1; x++) map[y][x] = t; };
  const carve = (c0, r0, c1, r1) => set(c0, r0, c1, r1, 0);

  // --- Treetop and hollow trunk (wings only) ---
  carve(1, 0, 70, 3);
  carve(3, 3, 4, 34);
  for (const r of [31, 27, 23, 19, 15, 11, 7]) set(3, r, 4, r, 5);   // resting branches inside the trunk
  set(8, 4, 70, 6, 9);                                                  // leafy canopy over the whole forest

  // --- Forest floor under the canopy ---
  carve(8, 7, 70, 24);
  carve(14, 25, 28, 26);

  // --- The hill: land on top, roll down, launch off the ramp ---
  set(8, 17, 13, 30, 1);                                                // hilltop
  for (let i = 0; i < 10; i++) { map[17 + i][14 + i] = 7; set(14 + i, 18 + i, 14 + i, 30, 1); }
  set(24, 27, 26, 30, 1);                                               // dip
  map[26][27] = 6; set(27, 27, 27, 30, 1);                              // ramp
  map[25][28] = 6; set(28, 26, 28, 30, 1);
  carve(29, 25, 32, 29); set(29, 29, 32, 29, 3);                        // thorn pit
  set(40, 21, 49, 21, 1);                                               // high ledge: only a pushed roll gets here

  // --- Clearing: mushroom + branch bridge back to the hilltop (one way) ---
  map[25][55] = 8;                                                      // bouncy mushroom (hop onto it)
  set(15, 12, 58, 12, 5);                                               // branch bridge; drops you onto the hilltop

  // --- Chimney down to the cave (one-way for an egg, climbable with legs) ---
  carve(62, 25, 65, 30);
  set(68, 22, 70, 22, 1); set(68, 23, 68, 24, 2);                       // rock pocket P1 (east ledge)

  // --- Cave ---
  carve(8, 31, 70, 34);
  carve(8, 28, 17, 30);                                                 // taller west end
  set(PLUG.c, PLUG.r, PLUG.c + 2, PLUG.r + 2, 2);                       // rock plug at the foot of the tree
  set(10, 32, 12, 32, 1); set(12, 33, 12, 34, 2);                       // rock pocket P2
  set(26, 33, 29, 33, 1);                                               // low slab: egg crawlspace
  set(67, 31, 70, 33, 1);                                               // egg tunnel at the east end
  // chimney climbing branches (after the cave carve so they aren't erased); the left side is a clean drop
  set(64, 32, 65, 32, 5); set(64, 29, 65, 29, 5); set(64, 26, 65, 26, 5);

  REQUIRED = [[PLUG.c, PLUG.r]];
  seeds = [[44, 20], [37, 19], [27, 34], [69, 34], [70, 24], [11, 34], [3, 21], [3, 13], [67, 12]].map(([c, r]) => seedAt(c, r));
  signs = [
    { c: 12, r: 17, t: ['Roll down the hill!', 'Hold → to go faster'] },
    { c: 52, r: 25, t: ['Back to the hill?', 'Jump on the mushroom!'] },
    { c: 59, r: 25, t: ['Careful! Dashing into', 'ANY wall cracks you'] },
    { c: 23, r: 35, t: ['A warm spot!', 'Rest here to hatch…'] },
    { c: 60, r: 35, t: ['Got legs? Climb', 'the branches up →'] },
    { c: 52, r: 35, t: ['Beetles bite!', 'Hop on their backs'] },
  ];
  enemies = [beetle(44, 35, -1, 34, 56)];
}

// ---------- Level 2: the creek (ASCII map) ----------
// '.' air  '#' ground  'R' rock  'G' gate rock (needed)  'P' plug rock (needed)  '^' thorns  '~' water  '=' branch
// '/' ramp  '\' downhill  'M' mushroom  'C' crumbling stone  '|' rising warm air  '*' seed  'U' seed in warm air
// 'b' beetle  'i' icicle  'E' start  'w' warm spot  '1'-'9' signs
const CREEK_MAP = String.raw`
#.........................................................................######....................
#.........................................................................######....................
#.........................................................................######....................
#.........................................................................######....................
#.........................................................................######....................
#...............................................................*.........######....................
#.............................................................=====.......######...............#####
#.........................................................................######...............#####
#.........................................................................######.......*.......#####
#........*................................................................######...............#####
#..1.E....b2..............................................................######...........====#####
#############\............................................................######...............#####
##############\...........................................................######...............#####
###############\..................................#####...................######............b..#####
################\.................................R...#...................P...............=====#####
#################\................................R.*.#.b...^^....b......6P......7.............#####
##################\...........................##################M####....#########.............#####
###################\...........b..*...........#######################....#########.............#####
####################\^^........####...........#######################..==#########..............*###
########################.........*........3........##################....###########~~~~~~~~~~~~~###
########################~~~~~~~~~~~~#############..##################....###########~~~~~~~~~~~~~###
########################~~~~~~~~~~~~#############..##################..==###########~~~~~~~~~~~~~###
########################~~~~~~~~~~~~#############..##################....###########~~~~~~~~~~~~~###
########################~~~~~~~~~~~~######...............G...............###########################
##########################################...............G.............==###########################
##########################################...............G...............###########################
##########################################............*..G...............###########################
######################################...R...........###.G....*........==###########################
######################################...R.........wwwww.G...............###########################
######################################.*........4..wwwww.G.5........b....###########################
##########################################~~~~~#############......##################################

####################################################################################################
####################################################################################################
####################################################################################################
`;

// ---------- Level 3: storm peak (ASCII map) ----------
const PEAK_MAP = String.raw`
#............................................................................................||||...
#............................................................................................||||...
#.....................................................................*......................||||...
#............................................................................................||||...
#...............................................................############################.||||.##
#...............................................................############################.||||.##
#...............................................................############################.||||.##
#...............................................................############################.||||.##
#...............................................................############################.||||.##
#.1..E..........................................................############################.||||=##
########\.......................................................############################.||||.##
#########\.........................*............................############################.||||.##
##########\.....................................................############################.||||.##
###########\....................................................############################.||||.##
############\...................................................############################.||U|.##
#############\..................................................############################.||||.##
##############\.................................................############################.||||.##
###############\................................................############################=||||.##
################\...............................................############################.||||.##
#################\..................................b...........############################.||||.##
##################\..../...............###################..################################.||||.##
###################\../#...............###################..################################.||||.##
########################...............###################..################################.||||.##
########################...............###################..################################.||||.##
########################...............###################..################################.||||.##
########################^^^^^^^^^^^^^^^###################..################################.||||=##
##########################################################..################################.||||.##
##########################################################..################################.||||.##
########################....G......i..i..i....i..i..i..i........############################.||||.##
########################....G...................................############################.||||.##
########################....G*........*.........................############################.|U||.##
########################....G##.................................############################.||||.##
########################....G..www................*.............############################.||||.##
########################....G..www3.....................2..........*########################=||||.##
########################....#######..CC.CC.#################################################.||||.##
########################....#######^^^^^^^^#################################################.||||.##
########################....################################################################.||||.##
########################....################################################################.||||.##
########################..........................................G........................P.||||.##
########################..........................................G........................P.||||.##
########################..........................................G........................P.||||.##
########################................................*.........G........................P.||||=##
########################.................*........................G..................*.....P.||||.##
########################..........................................G.................###....P.||||.##
########################...........................CC..CC..CC.....G........................P.||||.##
########################..4.....b...............5.................G.....b.......b........6.P.||||.##
######################################^^^^^^^^###^^^^^^^^^^^^^^#####################################
####################################################################################################
`;

const TILE_OF = { '#': 1, 'R': 2, 'G': 2, 'P': 2, '^': 3, '~': 4, '=': 5, '/': 6, '\\': 7, 'M': 8, 'L': 9, 'C': 10, '|': 11, 'U': 11 };
function parseLevel(src) {
  const rows = src.split('\n').filter(l => l.length);
  ROWS = rows.length; COLS = rows[0].length;
  map = []; seeds = []; signs = []; enemies = []; REQUIRED = []; WARM = null;
  for (let r = 0; r < ROWS; r++) {
    const line = [];
    for (let c = 0; c < COLS; c++) {
      const ch = rows[r][c] || '.';
      line.push(TILE_OF[ch] || 0);
      if (ch === '*' || ch === 'U') seeds.push(seedAt(c, r));
      else if (ch === 'b') enemies.push(beetle(c, r + 1, c % 2 ? 1 : -1));
      else if (ch === 'i') enemies.push(icicle(c, r));
      else if (ch === 'E') START = { c, r: r + 1 };
      else if (ch === 'G' || ch === 'P') REQUIRED.push([c, r]);
      else if (ch === 'w') WARM = WARM ? { c0: Math.min(WARM.c0, c), c1: Math.max(WARM.c1, c), r0: Math.min(WARM.r0, r), r1: Math.max(WARM.r1, r) } : { c0: c, c1: c, r0: r, r1: r };
      else if (ch >= '1' && ch <= '9') signs.push({ c, r: r + 1, t: LV.signs[+ch - 1] });
    }
    map.push(line);
  }
}
const seedAt = (c, r) => ({ x: c * TS + 16, y: r * TS + 16, got: false, ph: Math.random() * 6 });
const inRects = (rects, c, r) => rects.some(([c0, r0, c1, r1]) => c >= c0 && c <= c1 && r >= r0 && r <= r1);

// ---------- Level 4: the frozen hollow (hand-built) ----------
// Everything you've learned, at once: float across water as an egg, then hatch and spend your one
// dash budget (3 cracks, 3 required rock walls — not a single one to spare) past icicles, crumbling
// ice and a beetle-and-crow gauntlet, before flying up a chimney of rising warm air into the nest.
function buildFrozenHollow() {
  COLS = 100; ROWS = 40;
  map = Array.from({ length: ROWS }, () => new Array(COLS).fill(1));
  const set = (c0, r0, c1, r1, t) => { for (let y = r0; y <= r1; y++) for (let x = c0; x <= c1; x++) map[y][x] = t; };
  const carve = (c0, r0, c1, r1) => set(c0, r0, c1, r1, 0);

  START = { c: 3, r: 28 };
  carve(0, 18, 97, 27);                                                 // main cave corridor

  set(11, 28, 12, 28, 3);                                               // thorn hop (egg)

  const poolC0 = 18, poolC1 = 31;                                       // meltwater pool — float across
  carve(poolC0, 28, poolC1, 33);
  set(poolC0, 28, poolC1, 33, 4);                                       // surface flush with both banks

  WARM = { c0: 35, c1: 38, r0: 26, r1: 28 };                            // geothermal vent — hatch to legs

  set(40, 18, 40, 27, 2);                                               // required rock wall 1 (floor stays solid beneath)

  set(47, 28, 48, 28, 3);                                               // thorn hop (legs)

  carve(50, 29, 53, 33); set(50, 29, 53, 33, 4);                        // crumbling bridge over water —
  set(50, 28, 53, 28, 10);                                              // tuck (↓) fast if you fall in!

  set(55, 18, 56, 27, 2);                                               // required rock wall 2 (floor stays solid beneath)

  carve(74, 28, 77, 33); set(74, 28, 77, 33, 4);                        // gap — tuck and roll for speed, or swim back (flush banks)

  set(86, 18, 87, 27, 2);                                               // required rock wall 3 — last crack (floor stays solid)

  carve(93, 0, 96, 3);                                                  // open sky above the chimney
  carve(93, 4, 94, 27); set(93, 5, 94, 27, 11);                         // west half: clear straight up, no ceiling
  carve(95, 5, 96, 27); set(95, 5, 96, 27, 11);                         // east half: rising air, capped by the perch
  set(95, 4, 96, 4, 1);                                                 // nest perch — beside the shaft, not capping it
  NEST = { c0: 95, c1: 96, r: 4 };

  REQUIRED = [[40, 21], [55, 21], [86, 21]];
  seeds = [[21, 26], [25, 26], [29, 26], [44, 24], [52, 25], [62, 20], [80, 24], [84, 22], [90, 24], [95, 15]].map(([c, r]) => seedAt(c, r));
  enemies = [
    beetle(15, 28, 1, 13, 17), beetle(44, 28, 1), beetle(80, 28, -1),
    icicle(60, 18), icicle(63, 18), icicle(66, 18),
  ];
  for (const [c0, c1, row, spd, ph] of [[57, 68, 22, 2.4, 0], [92, 97, 19, 2.6, 0], [92, 97, 13, 2.9, 0.5], [92, 97, 7, 3.1, 0.25]]) enemies.push(crow(c0, c1, row, spd, ph));
  signs = [
    { c: 3, r: 28, t: ['Fourth egg, same deal.', 'One life — but you know the tricks now!'] },
    { c: 17, r: 28, t: ['Eggs float, remember?', 'Glide across, nice and easy'] },
    { c: 35, r: 28, t: ['Warm vents!', 'Rest here to hatch'] },
    { c: 39, r: 28, t: ['3 rocks, 3 cracks —', 'same rule works down here too'] },
    { c: 49, r: 28, t: ['Crumbling ice!', 'Fall in? Tuck (↓) and float!'] },
    { c: 57, r: 28, t: ['Icicles above, crows ahead —', "don't stop to admire the view"] },
    { c: 67, r: 28, t: ['Big gap ahead!', 'Get a running start'] },
    { c: 85, r: 28, t: ['Last rock, last crack.', 'Break it — then fly!'] },
  ];
}

// ---------- Level 5: boulder canyon (hand-built) ----------
// Dash through the brick wall and you wake a boulder up on the ridge behind you. It rolls after you down
// the hillside, faster than you can run — tuck (↓) and roll to out-pace it instead. Partway down, a pit
// waits in the hillside: jump it, and let the boulder itself plunge in behind you and plug it for good.
// Hatching happens the moment the last rock cracks — then it's a straight flight back up to the nest.
function buildBoulderHill() {
  COLS = 88; ROWS = 38;
  map = Array.from({ length: ROWS }, () => new Array(COLS).fill(1));
  const set = (c0, r0, c1, r1, t) => { for (let y = r0; y <= r1; y++) for (let x = c0; x <= c1; x++) map[y][x] = t; };
  const carve = (c0, r0, c1, r1) => set(c0, r0, c1, r1, 0);

  carve(0, 0, 72, 8);                                                   // open sky the whole way, for the flight home

  // --- Part 1: the canyon approach ---
  carve(0, 9, 31, 20);                                                  // canyon corridor, floor at row 21
  START = { c: 3, r: 21 };
  set(0, 6, 3, 6, 1); NEST = { c0: 0, c1: 3, r: 6 };                    // the nest you fell from — and fly back to (sits just under the thermal, so a cruising bird clears it and can dip down onto it)

  set(9, 21, 10, 21, 3);                                                // thorn hop
  WARM = { c0: 19, c1: 22, r0: 19, r1: 21 };                            // warm sand — hatch to legs

  set(32, 9, 33, 20, 2);                                                // the brick wall — dash through to wake the boulder

  // --- Part 2: the boulder hill ---
  // the slope starts flush with the part-1 floor (row 21) at col 34 and descends 1:1 from there
  carve(34, 9, 72, 37);
  for (let i = 0; i < 14; i++) { map[21 + i][34 + i] = 7; set(34 + i, 22 + i, 34 + i, 37, 1); }  // steep downhill run
  set(48, 35, 72, 37, 1);                                               // the landing below the hill, floor at row 35

  set(48, 9, 49, 34, 2);                                                // required rock: dash it mid-chase
  set(53, 9, 55, 37, 0);                                                // the pit — jump it, or fall forever
  set(59, 9, 60, 34, 2);                                                // required rock: the last crack — hatches you

  set(64, 5, 65, 34, 11);                                               // rising air, straight up to the open sky

  REQUIRED = [[32, 14], [48, 20], [59, 20]];
  enemies = [
    beetle(25, 21, -1, 23, 31),
    boulder(34, 8, { trigC: 32, trigR: 14, maxSpd: 6.5, rollAcc: 0.5, plugC0: 53, plugC1: 55, plugRow: 35 }),
  ];
  seeds = [[12, 18], [22, 18], [29, 18], [38, 22], [46, 30], [51, 32], [62, 32], [64, 10], [6, 6]].map(([c, r]) => seedAt(c, r));
  signs = [
    { c: 3, r: 21, t: ['Fifth egg, one life.', 'You know the drill by now'] },
    { c: 7, r: 21, t: ['Hop the thorns!'] },
    { c: 16, r: 21, t: ['Warm sand!', 'Rest here to hatch'] },
    { c: 29, r: 21, t: ['Something sleeps', 'behind that wall…'] },
    { c: 35, r: 22, t: ["RUN and it'll catch you!", 'Tuck (↓) and roll instead'] },

// above the top of the map is solid, except on levels with open sky, where a bird can fly up out of view (warm air keeps rising)
const tileAt = (c, r) => (c < 0 || c >= COLS || r >= ROWS) ? 1 : r < 0 ? (!LV.openSky ? 1 : map[0][c] === 11 ? 11 : 0) : map[r][c];
const isSolid = t => t === 1 || t === 2 || t === 8 || t === 9 || t === 10;
const isSlope = t => t === 6 || t === 7;
// y of a slope tile's surface at world x. '/' rises to the right, '\' falls to the right
function slopeY(t, c, r, x) { const lx = clamp(x - c * TS, 0, TS); return r * TS + (t === 6 ? TS - lx : lx); }
function slopeUnder(x, footY) {
  const c = Math.floor(x / TS);
  for (let r = Math.floor((footY - 24) / TS); r <= Math.floor((footY + 24) / TS); r++) {
    const t = tileAt(c, r);
    if (isSlope(t)) return { t, y: slopeY(t, c, r, x) };
  }
  return null;
}
// the water surface above (x, y) if that point is under water
function waterAt(x, y) {
  const c = Math.floor(x / TS); let r = Math.floor(y / TS);
  if (tileAt(c, r) !== 4) return null;
  while (tileAt(c, r - 1) === 4) r--;
  return r * TS;
}

function overlapSolids(x, y, w, h) {
  const out = [];
  const c0 = Math.floor(x / TS), c1 = Math.floor((x + w - 0.001) / TS);
  const r0 = Math.floor(y / TS), r1 = Math.floor((y + h - 0.001) / TS);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const t = tileAt(c, r);
    if (isSolid(t)) out.push({ c, r, t });
  }
  return out;
}

let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  else if (AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type = 'square', vol = 0.1, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, freq = 800, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, len = (AC.sampleRate * dur) | 0;
  const b = AC.createBuffer(1, len, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(AC.destination); s.start(t);
}

}
function setForm(f) { resizeTo(FORMS[f]); P.form = f; }
// resize the hitbox keeping the feet where they are
function resizeTo(n) { P.x += (P.w - n.w) / 2; P.y += P.h - n.h; P.w = n.w; P.h = n.h; }
const fits = n => !overlapSolids(P.x + (P.w - n.w) / 2, P.y + P.h - n.h, n.w, n.h).length;
// a leggy egg with its legs tucked in moves exactly like an egg
const physForm = () => P.form === 'legs' && P.tucked ? 'egg' : P.form;
const normAngle = a => ((a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;

// ============================ ENEMIES ============================
// a beetle walks back and forth on the ground; optional c0..c1 keeps it on a patch
function beetle(c, groundRow, dir = -1, c0 = 0, c1 = 1e9) { return { kind: 'beetle', x: c * TS + 3, y: groundRow * TS - 18, w: 26, h: 18, vx: 0.8 * dir, anim: Math.random() * 6, dead: 0, minX: c0 * TS, maxX: (c1 + 1) * TS }; }
function crow(c0, c1, row, spd, ph) {
  const x0 = c0 * TS, x1 = (c1 + 1) * TS - 30;
  return { kind: 'crow', x0, x1, y0: row * TS + 7, x: lerp(x0, x1, ph), y: row * TS + 7, w: 30, h: 18, vx: spd * (ph > 0.5 ? -1 : 1), anim: ph * 9, ph: ph * 6 };
}
function icicle(c, r) { return { kind: 'icicle', x: c * TS + 16, y: r * TS, y0: r * TS, w: 14, h: 28, st: 0, t: 0, vy: 0 }; }
// a boulder rests until the rock wall at (trigC,trigR) is dashed open, then falls and chases the player downhill;
// if it rolls into the pit spanned by plugC0..plugC1 it wedges there and plugs it with rock (safe to hop over)
function boulder(c, r, o) {
  return { kind: 'boulder', x: c * TS, y: r * TS, w: 36, h: 36, vx: 0, vy: 0, face: 1, rot: 0, active: false, lodged: false,
    trigC: o.trigC, trigR: o.trigR, maxSpd: o.maxSpd ?? 6.5, rollAcc: o.rollAcc ?? 0.5, plugC0: o.plugC0, plugC1: o.plugC1, plugRow: o.plugRow };
}

function updateEnemies() {
  for (const e of enemies) {
    if (e.kind === 'beetle') {
      if (e.dead) {
        e.dead++;
        if (e.fly) { e.x += e.fly * 4; e.y += e.vy; e.vy += 0.45; e.rot += 0.25 * e.fly; }
        if (e.dead > 60) e.gone = true;
        continue;
      }
      e.anim += 0.25;
      const nx = e.x + e.vx, c = Math.floor((e.vx > 0 ? nx + e.w : nx) / TS);
      const body = tileAt(c, Math.floor((e.y + e.h - 4) / TS)), feet = tileAt(c, Math.floor((e.y + e.h + 4) / TS));
      // turn around at walls, thorns, water, mushrooms and ledges
      if (isSolid(body) || body === 3 || body === 4 || !(isSolid(feet) || feet === 5) || feet === 8 || nx < e.minX || nx + e.w > e.maxX) e.vx = -e.vx;
      else e.x = nx;
    } else if (e.kind === 'crow') {
      e.x += e.vx;
      if (e.x < e.x0 || e.x > e.x1) { e.vx = -e.vx; e.x = clamp(e.x, e.x0, e.x1); }
      e.y = e.y0 + Math.sin(frame * 0.07 + e.ph) * 7; e.anim += 0.32;
      if (frame % 240 === Math.floor(e.ph * 30) && Math.abs(e.x - P.x) < VW) tone(700, 480, 0.18, 'sawtooth', 0.03);
    } else if (e.kind === 'icicle') {
      if (e.st === 0) {
        // anything passing underneath shakes it loose
        const px = P.x + P.w / 2;
        if (!P.dead && Math.abs(px - e.x) < 44 && P.y + P.h > e.y && P.y - e.y < 9 * TS) { e.st = 1; e.t = 22; SFX.creak(); }
      } else if (e.st === 1) { if (--e.t <= 0) e.st = 2; }
      else {
        e.vy = Math.min(e.vy + 0.6, 14); e.y += e.vy;
        const tip = tileAt(Math.floor(e.x / TS), Math.floor((e.y + e.h) / TS));
        if (isSolid(tip) || tip === 5 || tip === 3 || e.y > ROWS * TS) {
          e.gone = true; SFX.shatter();
          shards(e.x, e.y + e.h - 4, 9, ['#e8f6ff', '#bfe3ff', '#ffffff'], 3, 0.3, 6, 40);
        }
      }
    } else if (e.kind === 'boulder') {
      if (!e.active) {
        if (tileAt(e.trigC, e.trigR) !== 2) { e.active = true; shake = Math.max(shake, 6); SFX.creak(); }
        continue;
      }
      if (e.lodged) continue;
      e.anim = (e.anim || 0) + 0.2;
      // rolls after the player, picking up speed downhill — faster than a run, but a good tucked roll can still outpace it
      const dir = Math.sign((P.x + P.w / 2) - (e.x + e.w / 2)) || e.face;
      e.face = dir;
      e.vx = clamp(e.vx + dir * e.rollAcc, -e.maxSpd, e.maxSpd);
      e.rot += e.vx * 0.045;
      e.x += e.vx;
      if (overlapSolids(e.x, e.y, e.w, e.h).length) e.x -= e.vx;
      e.vy = Math.min(e.vy + 0.6, 15);
      e.y += e.vy;
      const hitsY = overlapSolids(e.x, e.y, e.w, e.h);
      if (hitsY.length) {
        if (e.vy > 0) e.y = Math.min(...hitsY.map(h => h.r)) * TS - e.h;
        else e.y = (Math.max(...hitsY.map(h => h.r)) + 1) * TS;
        e.vy = 0;
      }
      // rolled into the pit: wedge there and plug it with rock — safe to hop over from now on
      if (e.plugRow !== undefined) {
        const cx = e.x + e.w / 2;
        if (cx > e.plugC0 * TS && cx < (e.plugC1 + 1) * TS && e.y + e.h > e.plugRow * TS + TS) {
          e.lodged = true; e.gone = true;
          for (let c = e.plugC0; c <= e.plugC1; c++) { map[e.plugRow - 1][c] = 2; map[e.plugRow][c] = 2; }
          shake = Math.max(shake, 14); hitstop = 6; SFX.break();
          shards((e.plugC0 + e.plugC1 + 1) / 2 * TS, e.plugRow * TS, 14, ['#b8905f', '#8a6a48', '#d4ad7c'], 4, 0.35, 9, 60);
        }
      }
      if (e.y > ROWS * TS + 60) e.gone = true;
    }
  }
  enemies = enemies.filter(e => !e.gone);
}

// Touching an enemy: land on a beetle's back (or dash / roll fast into it) to squash it; anything else hurts
function touchEnemies(vyBefore, oldBottom) {
  const px = P.x + 3, py = P.y + 3, pw = P.w - 6, ph = P.h - 4;
  for (const e of enemies) {
    if (e.dead) continue;
    if (e.kind === 'icicle') {
      if (e.st === 2 && px < e.x + 5 && px + pw > e.x - 5 && py < e.y + e.h && py + ph > e.y + 6) { die('icicle'); return true; }
      continue;
    }
    if (e.kind === 'boulder') {
      if (!e.active || e.lodged) continue;

// ============================ GAME STATE ============================

let result = null, deathCause = '', endT = 0, flash = 0, flashAt = 400, selLevel = 0;

// ---------- progress: unlocked levels and record times (kept in this browser) ----------
// A level's score is its time plus 10 seconds for every seed left behind. Lower is better.
const SEED_PENALTY = 600;   // frames = 10 s
const progress = { unlocked: 1, best: LEVELS.map(() => null) };
try { Object.assign(progress, JSON.parse(localStorage.getItem('eggventure-progress')) || {}); } catch (e) {}
while (progress.best.length < LEVELS.length) progress.best.push(null);
function saveProgress() { try { localStorage.setItem('eggventure-progress', JSON.stringify(progress)); } catch (e) {} }
selLevel = progress.unlocked - 1;

function startGame(i = selLevel) {
  selLevel = i;
  beginLevel(i);
}
function toTitle() {
  state = 'title'; levelNo = 0; buildLevel(); P = newPlayer(); particles = []; banner = null; paused = false;
}
// quick = restart from the level's start without the intro (hold R)
function beginLevel(i, quick = false) {
  levelNo = i;
  buildLevel();
  P = newPlayer();
  seedCount = 0; particles = []; paused = false; resetHold = 0; hitstop = 0; shake = 0; banner = null; mushroomSquish = 0; wallHits = 0;
  levelT0 = timer; introT = 0; leafBurst = false;
  if (quick) {
    state = 'play'; P.sx = 0.7; P.sy = 1.3;
    showBanner('Level restarted', LV.name, 120);
  } else {
    state = 'intro';
    if (LV.intro === 'nest') { P.x = NEST.c0 * TS + 70; P.y = NEST.r * TS - P.h - 6; P.face = 1; }
    else { P.x = START.c * TS + 16 - P.w / 2 - 300; P.y = START.r * TS - P.h - 520; }
  }

}
let introT = 0, leafBurst = false, mushroomSquish = 0;
function updateIntro() {
  introT++;
  const landY = START.r * TS - P.h, landX = START.c * TS + 16 - P.w / 2;
  if (pressed('jump') || pressed('start')) { P.y = landY; P.x = landX; }
  if (LV.intro === 'nest') {
    if (introT < 70) P.angle = Math.sin(introT * 0.3) * 0.3 * (introT / 70);            // wobble…
    else if (introT < 95) { P.x += 3; P.angle += 0.14; }                                 // …tip over the edge
    else {                                                                              // …and fall
      P.vy = Math.min(P.vy + 0.35, 9); P.y += P.vy; P.x += 0.4; P.angle += 0.15;
      if (!leafBurst && P.y + P.h > 4 * TS) {

      }
    }
  } else if (P.y < landY) {
    // tumbling in on the wind
    const k = Math.min(1, introT / 90);
    P.x = landX - 300 * (1 - k); P.y = landY - 520 * (1 - k * k); P.angle += 0.2;
    if (frame % 3 === 0) particles.push({ x: P.x + rand(-40, 40), y: P.y + rand(-30, 30), vx: rand(2, 5), vy: rand(-0.5, 1.5), life: 40, max: 40, color: TH.snow ? 'rgba(255,255,255,0.9)' : 'rgba(120,170,80,0.9)', size: rand(2, 5), grav: 0, shape: TH.snow ? 'c' : 's', rot: 0, vr: 0.2 });
  }
  if (P.y >= landY) {
    P.y = landY; P.x = clamp(P.x, landX - 40, landX + 40); P.vy = 0; P.onGround = true; P.sx = 1.35; P.sy = 0.7; shake = 8;
    P.angle = 0; SFX.land(); puff(P.x + P.w / 2, P.y + P.h, 10, 'rgba(230,210,180,0.9)', 2, 22, 5);

function showBanner(title, sub, dur = 220) { banner = { title, sub, t: 0, dur }; }

// ============================ PARTICLES ============================
function puff(x, y, n, color, spd = 2, life = 30, size = 5, grav = 0) {
  for (let i = 0; i < n; i++) particles.push({ x, y, vx: rand(-spd, spd), vy: rand(-spd, spd), life, max: life, color, size: rand(size * 0.5, size), grav, shape: 'c' });
}
function shards(x, y, n, colors, spd = 4, grav = 0.35, size = 7, life = 50) {
  for (let i = 0; i < n; i++) particles.push({
    x, y, vx: rand(-spd, spd), vy: rand(-spd * 1.3, spd * 0.4), life: life + rand(-10, 10) | 0, max: life,
    color: colors[(Math.random() * colors.length) | 0], size: rand(size * 0.5, size), grav, shape: 's', rot: rand(0, 6), vr: rand(-0.3, 0.3)

}
function sparkle(x, y, n, color = '#fff6a8') {
  for (let i = 0; i < n; i++) particles.push({ x: x + rand(-14, 14), y: y + rand(-14, 14), vx: rand(-0.6, 0.6), vy: rand(-1.4, -0.3), life: 40, max: 40, color, size: rand(2, 4), grav: 0, shape: 'star' });
}

  for (let i = 0; i < n; i++) particles.push({ x: x + rand(-8, 8), y, vx: rand(-2.2, 2.2), vy: rand(-4.5, -1.5), life: 30, max: 30, color: 'rgba(210,240,255,0.9)', size: rand(2, 4.5), grav: 0.3, shape: 'c' });

function updateParticles() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.vx *= 0.98; p.life--; if (p.rot !== undefined) p.rot += p.vr; }

// ============================ UPDATE ============================
function update() {

    if (pressed('left')) selLevel = Math.max(0, selLevel - 1);
    if (pressed('right')) selLevel = Math.min(progress.unlocked - 1, selLevel + 1);
    if (pressed('start') || pressed('jump')) startGame();

  if (flash > 0) flash--;

}

const ROLL = { max: 13.5, coast: 10, slopeAcc: 0.35, fastFriction: 0.993, launch: 1.1, bounce: 23, rampJump: 4 };

// Keep grounded players glued to slopes (and let them stand on them)
function followSlope(wasGround) {
  P.slope = 0;
  if (P.vy < 0) return;
  const s = slopeUnder(P.x + P.w / 2, P.y + P.h);
  if (!s) return;
  const bottom = P.y + P.h;
  const sunk = bottom - s.y;
  if ((sunk >= 0 && sunk < 24) || (sunk < 0 && wasGround && -sunk <= Math.abs(P.vx) + 8)) {
    P.y = s.y - P.h; P.vy = 0; P.onGround = true;
    P.slope = s.t === 7 ? 1 : -1;   // which way is downhill
  }
}

function moveX(wasGround) {
  P.x += P.vx;

  const hits = overlapSolids(P.x, P.y, P.w, P.h).filter(h => !(wasGround && h.r * TS >= P.y + P.h - 16 - Math.abs(P.vx)));
  if (!hits.length) return;

    P.x -= P.vx;
    const rocks = hits.filter(h => h.t === 2);
    if (rocks.length) breakRocks(rocks);
    else { wallHits++; SFX.bonk(); shake = 12; hitstop = 6; puff(P.x + P.w / 2 + P.dx * 12, P.y + P.h / 2, 8, 'rgba(200,170,130,0.9)', 2.5, 22, 6); }

}

function moveY(vyBefore) {

  if (P.vy < 0) hits = hits.filter(h => h.r * TS < P.y + P.h - 16); // jumping off a slope: the corner by your feet isn't a ceiling

    if (oldBottom <= r * TS + 0.5 && !P.dropT) for (let c = c0; c <= c1; c++) if (tileAt(c, r) === 5) hits.push({ c, r, t: 5 });

    const top = Math.min(...hits.map(h => h.r));
    P.y = top * TS - P.h;
    // landing on a mushroom (not just rolling across it) bounces you way up
    if (vyBefore > 2.5 && hits.some(h => h.t === 8 && h.r === top)) {

}

function touchingSpikes() {
  const x = P.x + 4, y = P.y + 4, w = P.w - 8, h = P.h - 5;
  const c0 = Math.floor(x / TS), c1 = Math.floor((x + w) / TS), r0 = Math.floor(y / TS), r1 = Math.floor((y + h) / TS);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (tileAt(c, r) !== 3) continue;
    const sx = c * TS + 3, sy = r * TS + 14, sw = TS - 6, sh = TS - 14;
    if (x < sx + sw && x + w > sx && y < sy + sh && y + h > sy) return true;

}

function breakRocks(list) {
  const stack = list.map(h => [h.c, h.r]);
  while (stack.length) {
    const [c, r] = stack.pop();
    if (tileAt(c, r) !== 2) continue;
    map[r][c] = 0;
    shards(c * TS + 16, r * TS + 16, 4, ['#b8905f', '#8a6a48', '#d4ad7c', '#6e5238'], 4.5, 0.35, 9, 60);
    stack.push([c + 1, r], [c - 1, r], [c, r + 1], [c, r - 1]);
  }

function crackShell(brokeRock) {
  P.cracks++;
  SFX.crack();
  shards(P.x + P.w / 2, P.y + 8, 5, ['#fffaf0', '#ecd7b3'], 2.5, 0.3, 5, 35);
  if (P.cracks >= 3) { startTransform('bird'); return; }
  const left = 3 - P.cracks;
  if (brokeRock) showBanner(P.cracks === 1 ? 'CRACK!' : 'CRACK CRACK!', `${left} more hit${left > 1 ? 's' : ''} and you'll hatch`, 170);
  else showBanner('OUCH! Wall hit', `That cracked your shell…  ${left} hit${left > 1 ? 's' : ''} left before you hatch`, 190);
}

function startTransform(to) {

  P.vx = 0; P.vy = 0; P.dashT = 0; P.trail = [];

    setForm('legs'); P.legGrow = 0; P.heat = 0;
  }
}

function updateTransform() {
  P.trans--;

    // the shell strains and wobbles (drawn from LEG_POP), then the legs burst out through the bottom
    const popAt = Math.round(P.transMax * (1 - LEG_POP));
    P.angle = lerp(P.angle, 0, 0.12);
    if (P.trans > popAt) {
      P.legGrow = 0;
      if (P.trans % Math.max(4, Math.round(P.trans / 5)) === 0) { SFX.crack(); P.sx = 1.12; P.sy = 0.9; }
      if (frame % 4 === 0) sparkle(P.x + P.w / 2, P.y + P.h - 10, 1, '#ffc27a');
    } else {
      const t = (popAt - P.trans) / popAt;
      P.legGrow = 1 - Math.exp(-5 * t) * Math.cos(10 * t);   // shoots out, overshoots, settles
    }
    if (P.trans === popAt) {
      P.sx = 0.72; P.sy = 1.4; shake = Math.max(shake, 8); hitstop = 3;
      shards(P.x + P.w / 2, P.y + P.h - 6, 14, ['#fffaf0', '#f3e3c3', '#ecd7b3'], 3.5, 0.35, 7, 50);
      puff(P.x + P.w / 2, P.y + P.h, 10, 'rgba(255,220,170,0.9)', 2.5, 24, 6);
      sparkle(P.x + P.w / 2, P.y + P.h / 2, 8, '#ffc27a');
      SFX.pop(); SFX.power();
    }
    if (P.trans === 0) {
      P.angle = 0; P.legGrow = 1;
      showBanner('LEGS!', 'The warmth made you sprout legs!   Run · Jump · DASH (SHIFT) to smash rocks', 300);
      P.sy = 1.3; P.sx = 0.8;
    }
  } else {
    P.angle = lerp(P.angle, 0, 0.2);
    if (P.trans > 40 && frame % 12 === 0) { SFX.crack(); shards(P.x + P.w / 2, P.y + 10, 2, ['#fffaf0', '#ecd7b3'], 2, 0.3, 4, 25); }
    if (P.trans === 40) {
      setForm('bird'); P.sy = 1.5; P.sx = 0.7;
      shards(P.x + P.w / 2, P.y + P.h / 2, 26, ['#fffaf0', '#f3e3c3', '#ecd7b3'], 6, 0.3, 10, 70);
      sparkle(P.x + P.w / 2, P.y + P.h / 2, 16);
      shake = 22; SFX.hatch();
    }
    if (P.trans === 0) {
      P.flaps = FORMS.bird.flaps;
      if (requiredIntact()) showBanner('YOU HATCHED… too soon!', 'Birds can\'t dash — a rock still blocks the way.  Hold R to retry the level', 400);
      else showBanner('YOU HATCHED!', 'Flap: JUMP in the air  ·  Glide: hold JUMP  ·  Fly home to the nest!', 320);
    }
  }

}
const LEG_POP = 0.55;   // how far into the legs transformation the shell pops
const requiredIntact = () => REQUIRED.some(([c, r]) => tileAt(c, r) === 2);

function die(cause) {
  if (P.dead || P.trans) return;
  P.dead = 80; deathCause = cause;
  SFX.die(); shake = 12;
  if (cause === 'drown') { splash(P.x + P.w / 2, P.y + P.h - 10, 18); SFX.splash(); }
  const cols = P.form === 'bird' ? ['#ffd23f', '#fff0a8', '#f39a2b'] : ['#fffaf0', '#ecd7b3', '#ffcc33'];
  shards(P.x + P.w / 2, P.y + P.h / 2, 18, cols, 4, 0.3, 8, 60);

function levelClear() {
  const time = timer - levelT0, missed = seeds.length - seedCount, score = time + missed * SEED_PENALTY;
  const prev = progress.best[levelNo];
  result = { seeds: seedCount, of: seeds.length, time, missed, score, prev, record: prev === null || score < prev };
  if (result.record) progress.best[levelNo] = score;
  progress.unlocked = Math.min(LEVELS.length, Math.max(progress.unlocked, levelNo + 2));
  selLevel = Math.min(LEVELS.length - 1, levelNo + 1);
  saveProgress();
  state = levelNo === LEVELS.length - 1 ? 'win' : 'clear'; endT = 0;
  SFX.win();

function camTarget() {
  return {
    x: clamp(P.x + P.w / 2 - VW / 2 + camLook, 0, COLS * TS - VW),
    y: clamp(P.y + P.h / 2 - VH * 0.55, 0, ROWS * TS - VH),

function snapCamera() { camLook = 0; const t = camTarget(); camX = t.x; camY = t.y; }
function updateCamera() {
  camLook = lerp(camLook, clamp(P.vx * 14, -100, 100), 0.04);

  camX = lerp(camX, t.x, 0.12); camY = lerp(camY, t.y, 0.12);

// ============================ ART ============================
// Illustrated look. The static world (earth, grass, bark, leaves, branches, thorns) is painted once per level
// into an offscreen canvas; rocks, mushrooms, crumbling stones and water change during play, so they're drawn every frame.
const ART = {
  bark: '#8c5d3a', barkDark: '#5c3b22', barkHi: '#b08256', hollow: '#3a2416',
  leafDark: '#2d6638', leaf: '#43884a', leafMid: '#5ba458', leafHi: '#8fcb6c', leafLine: '#1d4527',
  thorn: '#5c3048', thornHi: '#90587a', thornTip: '#d27c8c',
  rock: '#cdb89b', rockMid: '#a88f72', rockDark: '#735d49',
  forestTop: '#5f8f78', forestBottom: '#b8d3a8', trunkFar: '#86ab91', trunkNear: '#6c9479',
};
let terrainArt = null, caveArt = null;
function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const isUnder = (c, r) => LV.under ? LV.under(c, r) : inRects(LV.caves, c, r - 1);
const hasDrips = (c, r) => LV.drips ? LV.drips(c, r) : inRects(LV.caves, c, r + 1);

function buildTerrainArt() {
  const W = COLS * TS, H = ROWS * TS, R = 13, rnd = seeded(11 + levelNo * 7);
  const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
  const earthAt = (c, r) => (c < 0 || c >= COLS || r < 0 || r >= ROWS) ? true : isEarth(map[r][c]);
  const outlineOf = (maskCanvas, color, px, target) => {
    const tint = mk(), tc = tint.getContext('2d');
    tc.drawImage(maskCanvas, 0, 0); tc.globalCompositeOperation = 'source-in'; tc.fillStyle = color; tc.fillRect(0, 0, W, H);
    for (let k = 0; k < 12; k++) { const an = k / 12 * Math.PI * 2; target.drawImage(tint, Math.cos(an) * px, Math.sin(an) * px); }
  };

  // 0) cave backdrop (behind everything in the world)
  caveArt = null;
  if (LV.caves) {
    caveArt = mk(); const k = caveArt.getContext('2d');
    k.filter = 'blur(5px)'; k.fillStyle = TH.cave;
    for (const [c0, r0, c1, r1] of LV.caves) k.fillRect(c0 * TS - 4, r0 * TS - 4, (c1 - c0 + 1) * TS + 8, (r1 - r0 + 1) * TS + 8);
    k.filter = 'none'; k.globalCompositeOperation = 'source-atop';
    for (let i = 0; i < W * H / 3000; i++) {
      const x = rnd() * W, y = rnd() * H;
      k.fillStyle = rnd() < 0.5 ? 'rgba(0,0,0,0.14)' : 'rgba(255,255,255,0.035)';
      k.beginPath(); k.ellipse(x, y, 5 + rnd() * 10, 3 + rnd() * 5, rnd() * 3, 0, 7); k.fill();
    }
    k.globalCompositeOperation = 'source-over';
  }

  // 1) silhouette of the ground, with rounded outer corners
  const mask = mk(), m = mask.getContext('2d');
  m.fillStyle = '#000';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = map[r][c], x = c * TS, y = r * TS;
    if (t === 1 || t === 8) {
      const o = (dc, dr) => !earthAt(c + dc, r + dr);
      m.beginPath();
      m.roundRect(x - 0.5, y - 0.5, TS + 1, TS + 1, [o(-1, 0) && o(0, -1) ? R : 0, o(1, 0) && o(0, -1) ? R : 0, o(1, 0) && o(0, 1) ? R : 0, o(-1, 0) && o(0, 1) ? R : 0]);
      m.fill();
    } else if (t === 6 || t === 7) {
      m.beginPath(); m.moveTo(x - 0.5, y + TS + 0.5); m.lineTo(x + TS + 0.5, y + TS + 0.5);
      if (t === 6) m.lineTo(x + TS + 0.5, y - 0.5); else m.lineTo(x - 0.5, y - 0.5);
      m.closePath(); m.fill();
    }
  }

  // 2) paint the earth: depth gradient, bark on trees, pebbles and soil layers
  const art = mk(), a = art.getContext('2d');
  a.drawImage(mask, 0, 0);
  a.globalCompositeOperation = 'source-in';
  const eg = a.createLinearGradient(0, 0, 0, H);
  eg.addColorStop(0, TH.earth[0]); eg.addColorStop(0.45, TH.earth[1]); eg.addColorStop(0.8, TH.earth[2]); eg.addColorStop(1, TH.earth[3]);
  a.fillStyle = eg; a.fillRect(0, 0, W, H);
  a.globalCompositeOperation = 'source-atop';
  a.lineCap = 'round';
  for (const [c0, r0, c1, r1] of LV.bark || []) {
    const bx0 = c0 * TS, bw = (c1 - c0 + 1) * TS, by0 = r0 * TS, by1 = (r1 + 1) * TS;
    const bg = a.createLinearGradient(0, by0, 0, by1);
    bg.addColorStop(0, ART.barkHi); bg.addColorStop(0.15, ART.bark); bg.addColorStop(0.85, ART.bark); bg.addColorStop(1, 'rgba(140,93,58,0)');
    a.fillStyle = bg; a.fillRect(bx0, by0, bw, by1 - by0);
    for (let i = 0; i < (c1 - c0 + 1) * 2.6; i++) {                       // bark grooves
      const bx = bx0 + 6 + rnd() * (bw - 12); let y = by0 + TS + rnd() * TS * 6;
      a.strokeStyle = i % 3 ? ART.barkDark : ART.barkHi; a.lineWidth = i % 3 ? 3 : 1.5;
      a.beginPath(); a.moveTo(bx, y);
      for (let k = 0; k < 6 && y < by1 - TS; k++) { y += TS * (0.8 + rnd() * 1.2); a.lineTo(bx + Math.sin(k * 1.7 + i) * 4, y); }
      a.stroke();
    }
  }
  for (let i = 0; i < W * H / 650; i++) {              // specks
    const x = rnd() * W, y = rnd() * H, sz = 1.2 + rnd() * 3.5;
    a.fillStyle = rnd() < 0.5 ? 'rgba(255,236,205,0.10)' : 'rgba(45,22,10,0.13)';
    a.beginPath(); a.ellipse(x, y, sz * 1.3, sz, rnd() * 3, 0, 7); a.fill();
  }
  a.strokeStyle = 'rgba(40,28,24,0.10)'; a.lineWidth = 2;
  for (let y = 20; y < H; y += 22 + rnd() * 14) {       // soil layers
    a.beginPath(); a.moveTo(0, y);
    for (let x = 0; x <= W; x += 40) a.lineTo(x, y + Math.sin(x * 0.013 + y) * 4);
    a.stroke();
  }
  for (let i = 0; i < W * H / 8000; i++) {             // embedded stones
    const x = rnd() * W, y = rnd() * H, sz = 3 + rnd() * 6;
    a.fillStyle = 'rgba(214,200,180,0.32)'; a.strokeStyle = 'rgba(40,28,24,0.25)'; a.lineWidth = 1.5;
    a.beginPath(); a.ellipse(x, y, sz * 1.3, sz, rnd() * 3, 0, 7); a.fill(); a.stroke();
  }
  const wx0 = WARM.c0 * TS, wy0 = (WARM.r1 + 1) * TS, ww = (WARM.c1 - WARM.c0 + 1) * TS;   // warm floor
  const wg = a.createRadialGradient(wx0 + ww / 2, wy0, 4, wx0 + ww / 2, wy0, 110);
  wg.addColorStop(0, 'rgba(255,140,60,0.85)'); wg.addColorStop(1, 'rgba(255,120,50,0)');
  a.fillStyle = wg; a.fillRect(wx0 - 100, wy0 - 10, ww + 200, 90);
  a.globalCompositeOperation = 'source-over';

  // 3) compose: outline behind, painted earth on top
  const out = mk(), o = out.getContext('2d');
  outlineOf(mask, TH.outline, 3, o);
  o.drawImage(art, 0, 0);

  // 4) surface details: grass (or snow), cave lips and drips, branches, thorns
  o.lineCap = 'round'; o.lineJoin = 'round';
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const t = map[r][c], x = c * TS, y = r * TS, above = tileAt(c, r - 1);
    const openUp = r > 0 && !earthAt(c, r - 1) && above !== 9 && above !== 4 && above !== 2 && above !== 10;
    if ((t === 1 || t === 8) && openUp) {
      if (!isUnder(c, r)) grassFlat(o, x, y, !earthAt(c - 1, r), !earthAt(c + 1, r), rnd);
      else { o.fillStyle = TH.lip; o.beginPath(); o.roundRect(x - 1, y - 2, TS + 2, 5, 2); o.fill(); }
    }
    if (t === 1 && above === 4) { o.fillStyle = 'rgba(210,190,140,0.5)'; o.fillRect(x, y - 2, TS, 4); }   // sandy bed under water
    const below = tileAt(c, r + 1);
    if (t === 1 && hasDrips(c, r) && !earthAt(c, r + 1) && below !== 5 && below !== 4 && below !== 2 && below !== 10 && rnd() < 0.45) {   // cave drips
      const dx = x + 6 + rnd() * 20, len = 6 + rnd() * 10;
      o.fillStyle = TH.snow ? '#cfe4f5' : TH.earth[2]; o.strokeStyle = TH.outline; o.lineWidth = 2;
      o.beginPath(); o.moveTo(dx - 5, y + TS - 1); o.quadraticCurveTo(dx - 1, y + TS + len * 0.6, dx, y + TS + len); o.quadraticCurveTo(dx + 1, y + TS + len * 0.6, dx + 5, y + TS - 1); o.fill(); o.stroke();
    }

  const slopes = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if ((map[r][c] === 6 || map[r][c] === 7) && !isUnder(c, r)) slopes.push([c * TS, r * TS, map[r][c] === 6]);
  for (let pass = 0; pass < 5; pass++) for (const [x, y, up] of slopes) grassSlope(o, x, y, up, rnd, pass);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {       // branches, drawn as whole runs

  const lm = mk(), l = lm.getContext('2d'), blobs = [];
  l.fillStyle = '#000';

    for (let k = 0; k < 3; k++) {
      const b = { x: c * TS + 16 + (rnd() - 0.5) * 22, y: r * TS + 16 + (rnd() - 0.5) * 18, r: 15 + rnd() * 8 };
      blobs.push(b); l.beginPath(); l.arc(b.x, b.y, b.r, 0, 7); l.fill();

    const la = mk(), lc = la.getContext('2d');
    lc.drawImage(lm, 0, 0); lc.globalCompositeOperation = 'source-in'; lc.fillStyle = ART.leafDark; lc.fillRect(0, 0, W, H);
    lc.globalCompositeOperation = 'source-atop';
    for (const b of blobs) { lc.fillStyle = ART.leaf; lc.beginPath(); lc.arc(b.x - 2, b.y - 4, b.r * 0.82, 0, 7); lc.fill(); }
    for (const b of blobs) { lc.fillStyle = ART.leafMid; lc.beginPath(); lc.arc(b.x - 4, b.y - 7, b.r * 0.55, 0, 7); lc.fill(); }
    for (const b of blobs) if (rnd() < 0.7) { lc.fillStyle = ART.leafHi; lc.beginPath(); lc.ellipse(b.x - 6, b.y - 10, b.r * 0.22, b.r * 0.14, -0.6, 0, 7); lc.fill(); }
    lc.strokeStyle = 'rgba(29,69,39,0.45)'; lc.lineWidth = 1.5;
    for (const b of blobs) { lc.beginPath(); lc.arc(b.x, b.y + 2, b.r * 0.7, 0.4, 1.6); lc.stroke(); }
    outlineOf(lm, ART.leafLine, 2.5, o);
    o.drawImage(la, 0, 0);
  }

function grassFlat(g, x, y, capL, capR, rnd) {
  const [hi, mid, dark] = TH.grass;

  g.fillStyle = dark;
  for (let k = 0; k < 4; k++) {                       // scalloped underside

  g.beginPath(); g.roundRect(x0, y - 5, x1 - x0, 11, [capL ? 7 : 0, capR ? 7 : 0, capR ? 5 : 0, capL ? 5 : 0]); g.fill();

      g.strokeStyle = TH.outline; g.lineWidth = 1.5; g.beginPath(); g.ellipse(bx, y - 6, 5, 3, 0, Math.PI * 1.1, Math.PI * 1.9); g.stroke();

function grassSlope(g, x, y, up, rnd, pass) {
  const [hi, mid, dark] = TH.grass;
  const ax = x - 1, ay = up ? y + TS + 1 : y - 1, bx = x + TS + 1, by = up ? y - 1 : y + TS + 1;
  const nx = up ? -0.707 : 0.707, ny = -0.707;       // upward normal
  const line = (k, color, w) => { g.strokeStyle = color; g.lineWidth = w; g.beginPath(); g.moveTo(ax + nx * k, ay + ny * k); g.lineTo(bx + nx * k, by + ny * k); g.stroke(); };
  if (pass === 0) return line(1.5, TH.outline, 14);
  if (pass === 1) return line(0, dark, 11);
  if (pass === 2) return line(1.5, mid, 7.5);
  if (pass === 3) return line(4.2, hi, 2.2);
  if (TH.snow) return;
  g.lineWidth = 2;
  for (let k = 0; k < 2; k++) if (rnd() < 0.5) {
    const t = 0.2 + rnd() * 0.6, px = ax + (bx - ax) * t + nx * 5, py = ay + (by - ay) * t + ny * 5, hgt = 6 + rnd() * 6;
    g.strokeStyle = mid; g.beginPath(); g.moveTo(px, py); g.quadraticCurveTo(px + nx * hgt * 0.5, py - hgt * 0.6, px + nx * hgt * 0.3 + (rnd() - 0.5) * 4, py - hgt); g.stroke();
  }
}

function branch(g, x, y, w, rnd) {
  const bg = g.createLinearGradient(0, y + 1, 0, y + 13);
  bg.addColorStop(0, ART.barkHi); bg.addColorStop(0.45, ART.bark); bg.addColorStop(1, ART.barkDark);
  g.fillStyle = bg; g.strokeStyle = TH.outline; g.lineWidth = 2.5;

  g.strokeStyle = 'rgba(70,40,20,0.55)'; g.lineWidth = 1.3;
  for (let px = x + 6; px < x + w - 6; px += 10 + rnd() * 14) { g.beginPath(); g.moveTo(px, y + 5 + rnd() * 2); g.lineTo(px + 6 + rnd() * 6, y + 5 + rnd() * 4); g.stroke(); }

  g.strokeStyle = TH.outline; g.lineWidth = 7; g.beginPath(); g.moveTo(x - 1, base); g.quadraticCurveTo(x + 16, base + (rnd() - 0.5) * 6, x + TS + 1, base); g.stroke();

// ---------- per-frame pieces ----------
function visibleTiles(fn) {

function drawTerrain() {

}

// ---------- enemies ----------
function drawEnemies() {
  for (const e of enemies) {
    if (e.x + 60 < camX || e.x - 60 > camX + VW || e.y + 60 < camY || e.y - 60 > camY + VH) continue;
    if (e.kind === 'beetle') drawBeetle(e);
    else if (e.kind === 'crow') drawCrow(e);
    else if (e.kind === 'boulder') drawBoulder(e);

  }
}
function drawBoulder(e) {
  const r = e.w / 2, cx = e.x + r, cy = e.y + e.h / 2;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(e.rot);
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.15, 0, 0, r);
  g.addColorStop(0, '#e2c393'); g.addColorStop(0.6, '#a4825a'); g.addColorStop(1, '#5e4429');
  ctx.fillStyle = g; ctx.strokeStyle = '#3f2e1d'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(63,46,29,0.55)'; ctx.lineWidth = 1.6;
  for (let i = 0; i < 4; i++) { const a = i * 1.6 + 0.4; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.3, Math.sin(a) * r * 0.3); ctx.lineTo(Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.85); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.35, r * 0.32, r * 0.18, -0.5, 0, 7); ctx.fill();

}
function drawBeetle(e) {

  }

  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(14, -9, 2, 0, 7); ctx.fill();

  ctx.fillStyle = '#ffdd55'; ctx.beginPath(); ctx.arc(12.5, -5.5, 2.2, 0, 7); ctx.fill();

// ---------- backgrounds ----------
const clouds = Array.from({ length: 8 }, (_, i) => ({ x: i * 210 + rand(0, 90), y: rand(20, 150), s: rand(0.7, 1.3) }));

function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, TH.sky[0]); g.addColorStop(0.55, TH.sky[1]); g.addColorStop(1, TH.sky[2]);

    ctx.fillStyle = sg; ctx.fillRect(0, 0, VW, VH);

  for (const c of clouds) {
    const w = VW + 320, x = (((c.x - camX * 0.1 + frame * (TH.storm ? 0.35 : 0.08)) % w) + w) % w - 160, y = c.y - camY * 0.15;
    const s = c.s * (TH.storm ? 1.5 : 1);
    ctx.fillStyle = TH.cloud[1];
    ctx.beginPath(); ctx.ellipse(x + 4, y + 8 * s, 50 * s, 13 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = TH.cloud[0];
    ctx.beginPath();
    ctx.ellipse(x, y, 44 * s, 15 * s, 0, 0, 7);
    ctx.ellipse(x + 20 * s, y - 11 * s, 26 * s, 18 * s, 0, 0, 7);

}
// a rolling hill band (or a jagged snowy range); optionally dotted with little round trees
function layer(par, base, amp, freq, color, trees, jag) {
  const b = base - camY * par;
  const hy = sx => {

    if (jag) return b - amp * (0.2 + 0.8 * Math.pow(1 - Math.abs(Math.sin(wx * freq)), 1.6) * (0.6 + 0.4 * Math.sin(wx * freq * 0.37 + 2)));
    return b - amp * (Math.sin(wx * freq) + 0.5 * Math.sin(wx * freq * 2.3 + 1));
  };
  if (trees) {
    for (let k = -1; k < 14; k++) {
      const step = 90, off = (camX * par) % step, sx = k * step - off + ((k * 37) % 40), hgt = 30 + ((k * 53) % 20);
      const y = hy(sx) + 6;
      ctx.fillStyle = trees;
      if (TH.snow) { ctx.beginPath(); ctx.moveTo(sx, y - hgt); ctx.lineTo(sx + hgt * 0.3, y); ctx.lineTo(sx - hgt * 0.3, y); ctx.fill(); continue; }   // little pines
      ctx.fillRect(sx - 2, y - hgt * 0.5, 4, hgt * 0.5);
      ctx.beginPath(); ctx.ellipse(sx, y - hgt * 0.6, hgt * 0.32, hgt * 0.42, 0, 0, 7); ctx.fill();
    }
  }
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, VH);
  for (let sx = 0; sx <= VW + 8; sx += 8) ctx.lineTo(sx, hy(sx));
  ctx.lineTo(VW, VH); ctx.fill();
  if (jag) {   // snow caps on the high parts
    const cap = b - amp * 0.62;
    ctx.fillStyle = 'rgba(245,248,255,0.85)'; ctx.beginPath(); ctx.moveTo(0, hy(0));
    for (let sx = 0; sx <= VW + 8; sx += 8) ctx.lineTo(sx, hy(sx));
    for (let sx = VW + 8; sx >= 0; sx -= 8) { const h = hy(sx); ctx.lineTo(sx, h < cap ? Math.min(cap + 6 + Math.sin(sx * 0.15) * 5, h + 40) : h); }
    ctx.fill();
  }
}

// world-space backdrop for level 1: the forest under the canopy, the hollow inside the tree, the cave
function forestBackdrop() {
  const fx0 = 8 * TS, fy0 = 7 * TS, fx1 = 71 * TS, fy1 = 27 * TS;   // forest ends where the ground/cave begins
  ctx.save();
  ctx.beginPath(); ctx.rect(fx0, fy0 - 20, fx1 - fx0, fy1 - fy0 + 20); ctx.clip();
  const fg = ctx.createLinearGradient(0, fy0, 0, fy1);
  fg.addColorStop(0, ART.forestTop); fg.addColorStop(1, ART.forestBottom);
  ctx.fillStyle = fg; ctx.fillRect(fx0, fy0 - 20, fx1 - fx0, fy1 - fy0 + 20);
  for (const [par, color, wMin, spacing] of [[0.55, ART.trunkFar, 18, 120], [0.3, ART.trunkNear, 30, 190]]) {
    const period = Math.ceil((VW + 200) / spacing) * spacing;
    for (let k = 0; k * spacing < period; k++) {
      const sxp = ((k * spacing - camX * par) % period + period) % period - 100 + ((k * 29) % 30);
      const wx = camX + sxp, tw = wMin + ((k * 17) % 14);
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.roundRect(wx - tw / 2, fy0 - 20, tw, fy1 - fy0 + 20, tw / 3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(wx - tw / 2 + 3, fy0, 3, fy1 - fy0);
    }
  }

    const sgr = ctx.createLinearGradient(0, fy0, 0, fy0 + 14 * TS);
    sgr.addColorStop(0, `rgba(255,248,210,${a})`); sgr.addColorStop(1, 'rgba(255,248,210,0)');
    ctx.fillStyle = sgr; ctx.beginPath();
    ctx.moveTo(x, fy0); ctx.lineTo(x + bw, fy0); ctx.lineTo(x + bw + 160, fy0 + 14 * TS); ctx.lineTo(x + 120, fy0 + 14 * TS); ctx.fill();
  }
  ctx.restore();
  // inside the hollow trunk
  ctx.fillStyle = ART.hollow; ctx.fillRect(3 * TS, 3 * TS, 2 * TS, (ROWS - 4) * TS);
  ctx.strokeStyle = 'rgba(120,80,50,0.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(3 * TS + 10 + i * 14, 3 * TS); ctx.lineTo(3 * TS + 8 + i * 14, (ROWS - 1) * TS); ctx.stroke(); }
  // cave
  const top = 26 * TS;
  const g = ctx.createLinearGradient(0, top, 0, top + 1.5 * TS);
  g.addColorStop(0, 'rgba(62,42,32,0)'); g.addColorStop(1, 'rgba(62,42,32,1)');
  ctx.fillStyle = g; ctx.fillRect(Math.max(camX, 5 * TS), top, VW, 1.5 * TS);
  ctx.fillStyle = TH.cave; ctx.fillRect(Math.max(camX, 5 * TS), top + 1.5 * TS, VW, ROWS * TS);
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  for (let r = CAVE_TOP - 1; r < ROWS; r++) for (let c = Math.max(5, Math.floor(camX / TS)); c < Math.floor(camX / TS) + 32; c++) {
    const h = hash(c, r); if (h % 4 === 0) { ctx.beginPath(); ctx.ellipse(c * TS + h % 20, r * TS + (h >> 4) % 20, 7, 4, 0, 0, 7); ctx.fill(); }
  }
}
// level 2: a weeping willow's crown behind the nest
function creekBackdrop() {
  const cx = 96 * TS, cy = 5 * TS;
  ctx.fillStyle = 'rgba(92,138,72,0.55)';
  for (const [dx, dy, rx, ry] of [[-150, 40, 120, 70], [-40, -10, 150, 80], [60, 40, 110, 70], [-90, -60, 100, 60]]) { ctx.beginPath(); ctx.ellipse(cx + dx, cy + dy, rx, ry, 0, 0, 7); ctx.fill(); }
  ctx.strokeStyle = 'rgba(110,160,80,0.55)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 16; i++) {                         // drooping strands
    const x = cx - 250 + i * 22, len = 110 + (hash(i, 3) % 120), sway = Math.sin(frame * 0.02 + i) * 6;
    ctx.beginPath(); ctx.moveTo(x, cy + 20); ctx.quadraticCurveTo(x + sway, cy + 20 + len * 0.6, x + sway * 1.5, cy + 20 + len); ctx.stroke();

}
// level 2 foreground: cattails by the water
function creekDecor() {
  for (const [c, r] of [[23, 19], [36, 20], [37, 20], [44, 20], [82, 19], [83, 19], [81, 16]]) {
    const x = c * TS + 10, y = r * TS;
    for (let k = 0; k < 3; k++) {
      const bx = x + k * 7, hgt = 26 + (hash(c, k) % 14), sway = Math.sin(frame * 0.03 + c + k) * 2;
      ctx.strokeStyle = '#5b8a3c'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(bx, y); ctx.quadraticCurveTo(bx, y - hgt * 0.5, bx + sway, y - hgt); ctx.stroke();
      if (k !== 1) { ctx.fillStyle = '#7a4a2a'; ctx.strokeStyle = TH.outline; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.roundRect(bx + sway - 2.5, y - hgt + 2, 5, 11, 2.5); ctx.fill(); ctx.stroke(); }
    }
